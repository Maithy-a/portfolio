<!DOCTYPE html>
<html>
<head>
    <title>Spotify Auth Callback</title>
    <script>
        const hash = window.location.hash.substring(1);
        console.log('Callback Hash:', hash); // Debug
        const params = new URLSearchParams(hash);
        if (params.get('access_token')) {
            localStorage.setItem('spotify_access_token', params.get('access_token'));
            localStorage.setItem('spotify_token_expiry', Date.now() + (params.get('expires_in') * 1000));
            window.opener.postMessage({ type: 'spotify-auth', hash }, window.location.origin);
            window.close();
        } else {
            console.error('Auth error:', params.get('error') || 'No error specified');
            window.opener.postMessage({ type: 'spotify-auth-error', error: params.get('error') || 'Unknown error' }, window.location.origin);
            window.close();
        }
    </script>
</head>
<body>
    Redirecting...
</body>
</html>
